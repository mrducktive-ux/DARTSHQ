<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<meta name="description" content="DARTS HQ 2.0 — an elite darts scoring, training and tournament platform.">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<title>DARTS HQ 2.0</title>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">D<span>H</span></div><div><b>DARTS HQ</b><small>ELITE EDITION 2.0</small></div></div>
    <nav id="nav">
      <button class="nav-item active" data-page="dashboard">⌂ <span>Dashboard</span></button>
      <button class="nav-item" data-page="play">◎ <span>Play darts</span></button>
      <button class="nav-item" data-page="players">♙ <span>Players</span></button>
      <button class="nav-item" data-page="stats">▥ <span>Statistics</span></button>
      <button class="nav-item" data-page="training">◈ <span>Training centre</span></button>
      <button class="nav-item" data-page="tournaments">♜ <span>Tournaments</span></button>
      <button class="nav-item" data-page="history">◷ <span>Match history</span></button>
      <button class="nav-item" data-page="checkout">⌁ <span>Checkout lab</span></button>
      <button class="nav-item" data-page="learn">▤ <span>Learning centre</span></button>
      <button class="nav-item" data-page="settings">⚙ <span>Settings</span></button>
    </nav>
    <div class="sidebar-foot"><span class="live-dot"></span> LOCAL MODE ACTIVE <small>Your data stays on this device</small></div>
  </aside>
  <main class="main">
    <header class="topbar"><button class="mobile-menu" id="menuBtn">☰</button><div><div class="eyebrow" id="eyebrow">YOUR DARTS COMMAND CENTRE</div><h1 id="pageTitle">Dashboard</h1></div><div class="top-actions"><span class="date-chip" id="today"></span><button class="icon-btn" id="quickSettings" title="Settings">⚙</button></div></header>
    <section id="page" class="page"></section>
    <footer>DARTS HQ 2.0 <span>•</span> Elite Edition <span>•</span> Offline-first, device-stored</footer>
  </main>
</div>
<div class="toast" id="toast"></div>
<dialog id="modal" class="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" id="modalClose">✕</button></div><div id="modalBody"></div></dialog>
<script src="js/app.js"></script>
</body>
</html>
